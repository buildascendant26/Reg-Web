<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ascendant — Under Development</title>
  <meta name="description" content="Ascendant is currently under development. Internal OC registration is open." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />

  <style>
    /* ═══ RESET ═══ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ═══ PALETTE — 3 colors from the logo ═══ */
    :root {
      --black: #131311;
      --white: #ffffff;
      --gray: #d4d4d4;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* ═══ FULL-PAGE CONTAINER ═══ */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 2rem;
      position: relative;
    }

    /* ═══ SUBTLE AMBIENT GLOW ═══ */
    .page::before {
      content: '';
      position: absolute;
      top: 42%;
      left: 50%;
      translate: -50% -50%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.025) 0%, transparent 65%);
      pointer-events: none;
    }

    /* ═══ LOGO ═══ */
    .logo {
      width: clamp(110px, 18vw, 160px);
      height: auto;
      margin-bottom: 3.5rem;
      opacity: 0;
      animation: logoEnter 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
      /* remove the square black background — make it blend */
      border-radius: 14px;
    }

    /* ═══ HEADLINE ═══ */
    .headline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(0.7rem, 2vw, 0.95rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--white);
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.5s forwards;
    }

    /* ═══ THIN RULE ═══ */
    .rule {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gray), transparent);
      margin: 0 auto 1.2rem;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.65s forwards;
    }

    /* ═══ SUBTEXT ═══ */
    .subtext {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(0.85rem, 1.8vw, 1rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gray);
      opacity: 0;
      animation: fadeUp 0.7s ease 0.8s forwards;
    }

    /* ═══ CTA BUTTON ═══ */
    .cta-area {
      margin-top: 3.5rem;
      opacity: 0;
      animation: fadeUp 0.8s ease 1s forwards;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      padding: 1rem 2.4rem;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(0.55rem, 1.3vw, 0.7rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--white);
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* fill sweep on hover */
    .cta::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--white);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 0;
    }

    .cta:hover::before {
      transform: scaleX(1);
    }

    .cta:hover {
      color: var(--black);
      border-color: var(--white);
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.08);
    }

    .cta-label,
    .cta-arrow {
      position: relative;
      z-index: 1;
    }

    .cta-arrow {
      width: 16px;
      height: 16px;
      transition: transform 0.3s ease;
    }

    .cta:hover .cta-arrow {
      transform: translateX(4px);
    }

    /* ═══ FOOTER ═══ */
    .footer {
      position: absolute;
      bottom: 2rem;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 400;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.15);
      opacity: 0;
      animation: fadeUp 0.5s ease 1.3s forwards;
    }

    /* ═══ CORNER MARKS ═══ */
    .mark {
      position: absolute;
      width: 20px;
      height: 20px;
      opacity: 0;
      animation: fadeIn 0.6s ease 1.4s forwards;
    }

    .mark--tl {
      top: 28px;
      left: 28px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
    }

    .mark--tr {
      top: 28px;
      right: 28px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    .mark--bl {
      bottom: 28px;
      left: 28px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
    }

    .mark--br {
      bottom: 28px;
      right: 28px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* ═══ KEYFRAMES ═══ */
    @keyframes logoEnter {
      from {
        opacity: 0;
        transform: scale(0.9) translateY(-12px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* ═══ RESPONSIVE ═══ */
    @media (max-width: 480px) {
      .cta {
        padding: 0.85rem 1.6rem;
        font-size: 0.55rem;
      }

      .mark {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="page" role="main">

    <!-- corner marks -->
    <span class="mark mark--tl" aria-hidden="true"></span>
    <span class="mark mark--tr" aria-hidden="true"></span>
    <span class="mark mark--bl" aria-hidden="true"></span>
    <span class="mark mark--br" aria-hidden="true"></span>

    <!-- actual logo -->
    <img class="logo" src="logo.jpg" alt="Ascendant logo" draggable="false" />

    <!-- status -->
    <h1 class="headline">Under Development</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="subtext"> We're Working on it.</p>

    <!-- CTA -->
    <div class="cta-area">
      <a id="oc-registration-btn" class="cta" href="register.html">
        <span class="cta-label">Continue to Internal OC Registration</span>
        <svg class="cta-arrow" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </a>
    </div>

  </main>
</body>

</html>
